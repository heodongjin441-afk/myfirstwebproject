<!DOCTYPE html>
<html lang="en">
<head>

    <title>로그인</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        header{
            display: flex;

            justify-content: center;
        }
        main{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        }

        <h1>login</h1>

    <main>

        <a href="./sign.html">회원가입</a>
